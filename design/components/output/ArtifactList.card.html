<!-- @dsCard group="Output" name="ArtifactList — 成果物" subtitle="生成された PDF / EPUB / テキスト / 表紙テンプレート" viewport="640x340" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../card-frame.css">
</head>
<body>
<div class="spec">

  <div class="spec__group">
    <div class="atb-row" style="justify-content:space-between">
      <p class="spec__label" style="margin:0">at-book-out/</p>
      <span class="atb-status atb-status--done">完了 ・ 22.4 秒</span>
    </div>

    <div class="atb-stack atb-stack--tight">
      <div class="atb-artifact">
        <span class="atb-artifact__kind">PDF</span>
        <div class="atb-artifact__body">
          <div class="atb-artifact__name">novel.pdf</div>
          <div class="atb-artifact__meta">A6 縦組み ・ 214 頁 ・ 3.8 MB</div>
        </div>
        <button class="atb-btn atb-btn--secondary atb-btn--sm">開く</button>
        <button class="atb-btn atb-btn--ghost atb-btn--sm">保存</button>
      </div>

      <div class="atb-artifact">
        <span class="atb-artifact__kind">EPUB</span>
        <div class="atb-artifact__body">
          <div class="atb-artifact__name">novel.epub</div>
          <div class="atb-artifact__meta">リフロー ・ 縦中横のメタ注入済み ・ 1.2 MB</div>
        </div>
        <button class="atb-btn atb-btn--secondary atb-btn--sm">開く</button>
        <button class="atb-btn atb-btn--ghost atb-btn--sm">保存</button>
      </div>

      <div class="atb-artifact">
        <span class="atb-artifact__kind">COVER</span>
        <div class="atb-artifact__body">
          <div class="atb-artifact__name">cover-template.pdf</div>
          <div class="atb-artifact__meta">背幅 19.3 mm ・ 塗り足し 3 mm ガイド入り</div>
        </div>
        <button class="atb-btn atb-btn--secondary atb-btn--sm">開く</button>
        <button class="atb-btn atb-btn--ghost atb-btn--sm">保存</button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
