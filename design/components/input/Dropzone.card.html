<!-- @dsCard group="Input" name="Dropzone — 原稿の投げ込み" subtitle="待機 / ドラッグ中 / 受理 / 却下 の4状態" viewport="640x620" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../card-frame.css">
</head>
<body>
<div class="spec">

  <div class="spec__group">
    <p class="spec__label">待機 — idle</p>
    <div class="atb-drop">
      <div class="atb-drop__mark">＠</div>
      <div class="atb-drop__title">原稿をここへ</div>
      <div class="atb-drop__sub">ドラッグ＆ドロップ、またはクリックして選択</div>
      <div class="atb-drop__types">.atb / .txt / .md</div>
    </div>
  </div>

  <div class="spec__group">
    <p class="spec__label">ドラッグ中 — over</p>
    <div class="atb-drop atb-drop--over" style="min-height:150px">
      <div class="atb-drop__mark">＠</div>
      <div class="atb-drop__title">放して読み込む</div>
    </div>
    <p class="spec__note">領域に入った瞬間だけ、破線が朱の実線に変わる。この系で面が色を持つ数少ない場面。</p>
  </div>

  <div class="spec__group">
    <p class="spec__label">受理済み — filled</p>
    <div class="atb-drop atb-drop--filled">
      <div class="atb-row" style="gap:10px">
        <span class="atb-file__ext">atb</span>
        <span class="atb-mono" style="color:var(--color-text-strong)">追加でもう一冊ぶん放り込める</span>
      </div>
      <button class="atb-btn atb-btn--ghost atb-btn--sm">選択…</button>
    </div>
    <p class="spec__note">原稿を受理したら領域は帯まで縮み、主役をファイル一覧に譲る。</p>
  </div>

  <div class="spec__group">
    <p class="spec__label">却下 — reject</p>
    <div class="atb-drop atb-drop--reject" style="min-height:130px">
      <div class="atb-drop__mark" style="color:var(--color-accent)">×</div>
      <div class="atb-drop__title" style="color:var(--color-accent-text)">この形式は読めない</div>
      <div class="atb-drop__types">受け付けるのは .atb / .txt / .md</div>
    </div>
  </div>

</div>
</body>
</html>
